[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
# The old `stdout_callback = yaml` plugin was removed in community.general 12;
# this is the supported ansible-core equivalent.
stdout_callback = default
result_format = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = False
nocows = 1

# ansible-core 2.24 stops auto-injecting facts as top-level `ansible_*` vars.
# Everything here already uses ansible_facts['...'], so opt in early and keep
# the deprecation warnings out of the output.
inject_facts_as_vars = False

[privilege_escalation]
become = False
become_method = sudo
# Pass -K when running a playbook that escalates; leaving this False keeps
# ad-hoc commands (e.g. bootstrap's ping) from prompting unnecessarily.
become_ask_pass = False
