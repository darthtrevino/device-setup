---
- name: Enable the Hyprland COPR repository
  become: true
  community.general.copr:
    name: "{{ hyprland_copr }}"
    state: enabled

- name: Keep quickshell out of the Hyprland COPR
  become: true
  community.general.ini_file:
    path: /etc/yum.repos.d/_{{ hyprland_copr_repo | replace(':', '_') }}.repo
    section: "{{ hyprland_copr_repo }}"
    option: excludepkgs
    value: quickshell
    mode: "0644"
    no_extra_spaces: true
  # The COPR carries its own quickshell build that lags the one in Fedora and
  # loses the IPC calls the shell relies on. Excluding it here lets the
  # omarchy_shell role pull quickshell from fedora/updates instead.
  failed_when: false

- name: Install the Hyprland desktop packages
  become: true
  ansible.builtin.dnf:
    name: "{{ hyprland_packages }}"
    state: present

- name: Enable the Bluetooth service
  become: true
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true
    state: started

- name: Read the installed Hyprland version
  ansible.builtin.command:
    cmd: hyprland --version
  register: hyprland_version_output
  changed_when: false
  check_mode: false

- name: Require a Hyprland release that understands the Lua configuration
  ansible.builtin.assert:
    that:
      - hyprland_installed_version is version(hyprland_minimum_version, '>=')
    fail_msg: >-
      Hyprland {{ hyprland_installed_version }} is older than
      {{ hyprland_minimum_version }}, which is the first release to read
      hyprland.lua. An older build ignores the file entirely and starts an
      unconfigured session.
  vars:
    hyprland_installed_version: >-
      {{ hyprland_version_output.stdout | regex_search('(\d+\.\d+\.\d+)', '\1') | first }}

- name: Ensure the Hyprland configuration directory exists
  ansible.builtin.file:
    path: "{{ hyprland_config_dir }}"
    state: directory
    mode: "0755"

- name: Install the Hyprland configuration
  ansible.builtin.template:
    src: hyprland.lua.j2
    dest: "{{ hyprland_config_dir }}/hyprland.lua"
    mode: "0644"

- name: Install the hypridle, hyprlock and hyprpaper configuration
  ansible.builtin.copy:
    src: "config/{{ item }}"
    dest: "{{ hyprland_config_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - hypridle.conf
    - hyprlock.conf
    - hyprpaper.conf

- name: Ensure the supporting configuration directories exist
  ansible.builtin.file:
    path: "{{ workstation_config_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - fontconfig
    - mako
    - rofi

- name: Install the mako, rofi and fontconfig configuration
  ansible.builtin.copy:
    src: "config/{{ item.src }}"
    dest: "{{ workstation_config_dir }}/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: fonts.conf, dest: fontconfig/fonts.conf }
    - { src: mako-config, dest: mako/config }
    - { src: rofi-config.rasi, dest: rofi/config.rasi }
  loop_control:
    label: "{{ item.dest }}"

- name: Ensure the wallpaper directory exists
  ansible.builtin.file:
    path: "{{ hyprland_wallpaper_dir }}"
    state: directory
    mode: "0755"

- name: Find the wallpapers already available
  ansible.builtin.find:
    paths: "{{ hyprland_wallpaper_dir }}"
    file_type: any
  register: hyprland_wallpapers
  check_mode: false

- name: Seed the wallpaper directory from the Hyprland defaults
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ hyprland_wallpaper_dir }}/hypr-{{ item | basename }}"
    state: link
    force: true
  loop: "{{ query('fileglob', '/usr/share/hypr/wall*.png') | sort }}"
  # hyprpaper shuffles whatever is in this directory every 15 minutes; with an
  # empty directory it renders nothing at all, so ship a starting set and then
  # leave the user's own wallpapers alone.
  when: hyprland_wallpapers.matched | default(0) == 0

- name: Install the Hyprland helper scripts
  ansible.builtin.copy:
    src: "bin/{{ item }}"
    dest: "{{ workstation_local_bin }}/{{ item }}"
    mode: "0755"
  loop: "{{ hyprland_helpers }}"
