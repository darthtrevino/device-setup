$font = JetBrainsMono Nerd Font
$background = rgba(1a1a1aff)
$surface = rgba(2a2a2af2)
$foreground = rgba(ddddddff)
$muted = rgba(888888ff)
$cyan = rgba(33ccffff)
$green = rgba(00ff99ff)
$danger = rgba(ff6677ff)

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 3, easeOut
}

background {
    monitor =
    path = screenshot
    color = $background
    blur_passes = 4
    blur_size = 7
    noise = 0.012
    contrast = 1.05
    brightness = 0.55
    vibrancy = 0.15
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $cyan
    font_size = 88
    font_family = $font
    position = 0, 165
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $foreground
    font_size = 22
    font_family = $font
    position = 0, 92
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $green
    font_size = 16
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    rounding = 12
    dots_center = true
    dots_spacing = 0.25
    fade_on_empty = false
    hide_input = false

    outer_color = $cyan
    inner_color = $surface
    font_color = $foreground
    check_color = $green
    fail_color = $danger

    font_family = $font
    placeholder_text = Password
    check_text = Authenticating...
    fail_text = Authentication failed

    position = 0, -55
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter to unlock
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, -112
    halign = center
    valign = center
}
