---
- name: Import the Microsoft package signing key
  become: true
  ansible.builtin.rpm_key:
    key: "{{ vscode_gpg_key_url }}"
    state: present

- name: Configure the Visual Studio Code dnf repository
  become: true
  ansible.builtin.yum_repository:
    name: vscode
    description: Visual Studio Code
    baseurl: "{{ vscode_repo_baseurl }}"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ vscode_gpg_key_url }}"

- name: Install Visual Studio Code
  become: true
  ansible.builtin.dnf:
    name: code
    state: present
