---
# Installed from Microsoft's yum repository rather than a one-off .rpm download
# so that `dnf upgrade` keeps it current.
vscode_gpg_key_url: https://packages.microsoft.com/keys/microsoft.asc
vscode_repo_baseurl: https://packages.microsoft.com/yumrepos/vscode

# Settings and extensions are shared with the macOS and Windows setups.
vscode_settings_dir: "{{ workstation_config_dir }}/Code/User"
vscode_extensions: >-
  {{ lookup('ansible.builtin.file', workstation_shared_dir ~ '/vscode/extensions.txt').splitlines()
     | map('trim') | reject('match', '^(#|$)') | list }}
# Optional, uncommitted list for org-specific/private extensions.
vscode_local_extensions_file: "{{ workstation_home }}/.vscode-extensions.local.txt"
