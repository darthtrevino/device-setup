---
- name: Install Git
  become: true
  ansible.builtin.dnf:
    name: git
    state: present

# ~/.gitconfig.local holds the machine's default identity and org credentials;
# it is never committed, so it is seeded from the shared template exactly once
# and later hand edits are left alone.
- name: Create ~/.gitconfig.local from the shared template
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', workstation_shared_dir ~ '/git/gitconfig.local.example', rstrip=false)
         | regex_replace('(?m)^\tname = .*$', '\tname = ' ~ git_user_name)
         | regex_replace('(?m)^\temail = .*$', '\temail = ' ~ git_user_email) }}
    dest: "{{ workstation_home }}/.gitconfig.local"
    mode: "0644"
    force: false

- name: Inspect ~/.gitconfig
  ansible.builtin.stat:
    path: "{{ workstation_home }}/.gitconfig"
  register: git_gitconfig
  check_mode: false

# Linking with force would silently delete a hand-written ~/.gitconfig; keep
# it next to the link the same way the macOS and Windows bootstraps do.
- name: Back up an existing ~/.gitconfig
  ansible.builtin.command:
    cmd: >-
      mv {{ workstation_home }}/.gitconfig
      {{ workstation_home }}/.gitconfig.{{ ansible_facts['date_time']['iso8601_basic_short'] }}.bak
  when: git_gitconfig.stat.exists and not git_gitconfig.stat.islnk
  changed_when: true

- name: Link ~/.gitconfig to the shared Git config
  ansible.builtin.file:
    src: "{{ workstation_shared_dir }}/git/gitconfig"
    dest: "{{ workstation_home }}/.gitconfig"
    state: link
    force: true
