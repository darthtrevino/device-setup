---
- name: Reload ZSA udev rules
  become: true
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true
  listen: Reload ZSA device access

# Re-runs the new rules against already-connected keyboards, so access is
# granted without unplugging the board or rebooting.
- name: Trigger ZSA device rules
  become: true
  ansible.builtin.command:
    cmd: udevadm trigger --subsystem-match=hidraw --subsystem-match=usb --action=change
  changed_when: true
  listen: Reload ZSA device access
