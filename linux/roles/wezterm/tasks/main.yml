---
- name: Import the WezTerm COPR signing key
  become: true
  ansible.builtin.rpm_key:
    key: "{{ wezterm_copr_gpgkey }}"
    state: present

- name: Configure the WezTerm dnf repository
  become: true
  ansible.builtin.yum_repository:
    name: "copr-{{ wezterm_copr_owner }}-{{ wezterm_copr_project }}"
    description: "Copr repo for {{ wezterm_copr_project }} owned by {{ wezterm_copr_owner }}"
    baseurl: "{{ wezterm_copr_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ wezterm_copr_gpgkey }}"
    # A third-party repo should not be able to block a system-wide upgrade.
    skip_if_unavailable: true
    enabled: true
    state: present

- name: Install WezTerm
  become: true
  ansible.builtin.dnf:
    name: "{{ wezterm_package }}"
    state: present

- name: Ensure the WezTerm configuration directory exists
  ansible.builtin.file:
    path: "{{ wezterm_config_dir }}"
    state: directory
    mode: "0755"

# WezTerm watches this file and reloads on save, so no restart is needed.
- name: Install the WezTerm configuration
  ansible.builtin.template:
    src: wezterm.lua.j2
    dest: "{{ wezterm_config_path }}"
    mode: "0644"
    backup: true

# kdeglobals is shared with the rest of Plasma and rewritten by KDE itself, so
# only these two keys are touched rather than templating the whole file.
- name: Make WezTerm the default KDE terminal
  community.general.ini_file:
    path: "{{ wezterm_kdeglobals }}"
    section: General
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - {option: TerminalService, value: "{{ wezterm_desktop_file }}"}
    - {option: TerminalApplication, value: "{{ wezterm_package }}"}
  when: wezterm_set_default_terminal | bool
