---
- name: Install the Voxtype runtime dependencies
  become: true
  ansible.builtin.dnf:
    name: "{{ voxtype_packages }}"
    state: present

# The release RPM ships its own signature rather than a repository key, so GPG
# checking is disabled for this artifact only.
- name: Install Voxtype
  become: true
  ansible.builtin.dnf:
    name: "{{ voxtype_rpm_url }}"
    state: present
    disable_gpg_check: true

- name: Ensure the Voxtype configuration directory exists
  ansible.builtin.file:
    path: "{{ workstation_home }}/.config/voxtype"
    state: directory
    mode: "0755"

- name: Install the Voxtype configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ workstation_home }}/.config/voxtype/config.toml"
    mode: "0644"
  notify: Restart Voxtype

- name: Look for the transcription model
  ansible.builtin.find:
    paths: "{{ workstation_home }}/.local/share/voxtype"
    patterns: "*{{ voxtype_model }}*"
    recurse: true
  register: voxtype_model_files

# The daemon refuses to start without a model, so fetch it before enabling the
# service.
- name: Download the transcription model
  ansible.builtin.command:
    cmd: voxtype setup --download
  when: voxtype_model_files.matched | int == 0
  changed_when: true

- name: Enable the Voxtype daemon
  ansible.builtin.systemd_service:
    name: voxtype.service
    scope: user
    enabled: true
    state: started

- name: Ensure the local applications directory exists
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/share/applications"
    state: directory
    mode: "0755"

- name: Install the Voxtype toggle launcher
  ansible.builtin.template:
    src: voxtype-toggle.desktop.j2
    dest: "{{ workstation_home }}/.local/share/applications/{{ voxtype_shortcut_desktop_file }}"
    mode: "0644"

- name: Read the current Voxtype shortcut
  ansible.builtin.command:
    argv:
      - gdbus
      - call
      - --session
      - --dest
      - org.kde.kglobalaccel
      - --object-path
      - /kglobalaccel
      - --method
      - org.kde.KGlobalAccel.shortcutKeys
      - '["{{ voxtype_shortcut_desktop_file }}","_launch","{{ voxtype_shortcut_name }}","{{ voxtype_shortcut_name }}"]'
  register: voxtype_current_shortcut
  changed_when: false
  check_mode: false
  failed_when: false

# kglobalaccel lives inside kwin_wayland and rewrites kglobalshortcutsrc itself,
# so the binding is registered over D-Bus. Editing that file directly would be
# overwritten, and picking the change up would mean restarting the compositor.
- name: Register the Voxtype global shortcut
  when: voxtype_shortcut_keycode | string not in voxtype_current_shortcut.stdout
  block:
    - name: Declare the Voxtype shortcut action
      ansible.builtin.command:
        argv:
          - gdbus
          - call
          - --session
          - --dest
          - org.kde.kglobalaccel
          - --object-path
          - /kglobalaccel
          - --method
          - org.kde.KGlobalAccel.doRegister
          - '["{{ voxtype_shortcut_desktop_file }}","_launch","{{ voxtype_shortcut_name }}","{{ voxtype_shortcut_name }}"]'
      changed_when: true

    # Flag 4 is NoAutoloading: set this key sequence rather than reloading
    # whatever was stored previously.
    - name: Bind the Voxtype shortcut to {{ voxtype_shortcut }}
      ansible.builtin.command:
        argv:
          - gdbus
          - call
          - --session
          - --dest
          - org.kde.kglobalaccel
          - --object-path
          - /kglobalaccel
          - --method
          - org.kde.KGlobalAccel.setShortcutKeys
          - '["{{ voxtype_shortcut_desktop_file }}","_launch","{{ voxtype_shortcut_name }}","{{ voxtype_shortcut_name }}"]'
          - "[([{{ voxtype_shortcut_keycode }}],)]"
          - "4"
      changed_when: true
