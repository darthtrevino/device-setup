---
- name: Install the Voxtype runtime dependencies
  become: true
  ansible.builtin.dnf:
    name: "{{ voxtype_packages }}"
    state: present

# The release RPM ships its own signature rather than a repository key, so GPG
# checking is disabled for this artifact only.
- name: Install Voxtype
  become: true
  ansible.builtin.dnf:
    name: "{{ voxtype_rpm_url }}"
    state: present
    disable_gpg_check: true

- name: Ensure the Voxtype configuration directory exists
  ansible.builtin.file:
    path: "{{ workstation_home }}/.config/voxtype"
    state: directory
    mode: "0755"

# evdev device nodes are root:input 0660, so the daemon cannot watch the
# keyboard without this. Group membership only applies to sessions started
# afterwards, so the hotkey stays dead until the next login.
- name: Grant access to input devices for the built-in hotkey
  become: true
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: "{{ voxtype_hotkey_group }}"
    append: true
  when: voxtype_hotkey_enabled

- name: Install the Voxtype configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ workstation_home }}/.config/voxtype/config.toml"
    mode: "0644"
  notify: Restart Voxtype

- name: Look for the transcription model
  ansible.builtin.find:
    paths: "{{ workstation_home }}/.local/share/voxtype"
    patterns: "*{{ voxtype_model }}*"
    recurse: true
  register: voxtype_model_files

# The daemon refuses to start without a model, so fetch it before enabling the
# service.
- name: Download the transcription model
  ansible.builtin.command:
    cmd: voxtype setup --download
  when: voxtype_model_files.matched | int == 0
  changed_when: true

- name: Enable the Voxtype daemon
  ansible.builtin.systemd_service:
    name: voxtype.service
    scope: user
    enabled: true
    state: started

- name: Ensure the local applications directory exists
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/share/applications"
    state: directory
    mode: "0755"

- name: Install the Voxtype toggle launcher
  ansible.builtin.template:
    src: voxtype-toggle.desktop.j2
    dest: "{{ workstation_home }}/.local/share/applications/{{ voxtype_shortcut_desktop_file }}"
    mode: "0644"
  when: voxtype_kde_shortcut_enabled

- name: Remove the Voxtype toggle launcher when the shortcut is unused
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/share/applications/{{ voxtype_shortcut_desktop_file }}"
    state: absent
  when: not voxtype_kde_shortcut_enabled

- name: Read the current Voxtype shortcut
  ansible.builtin.command:
    argv:
      - gdbus
      - call
      - --session
      - --dest
      - org.kde.kglobalaccel
      - --object-path
      - /kglobalaccel
      - --method
      - org.kde.KGlobalAccel.shortcutKeys
      - '["{{ voxtype_shortcut_desktop_file }}","_launch","{{ voxtype_shortcut_name }}","{{ voxtype_shortcut_name }}"]'
  register: voxtype_current_shortcut
  changed_when: false
  check_mode: false
  failed_when: false

# kglobalaccel lives inside kwin_wayland and rewrites kglobalshortcutsrc itself,
# so the binding is registered over D-Bus. Editing that file directly would be
# overwritten, and picking the change up would mean restarting the compositor.
- name: Register the Voxtype global shortcut
  when:
    - voxtype_kde_shortcut_enabled
    - voxtype_shortcut_keycode | string not in voxtype_current_shortcut.stdout
  block:
    - name: Declare the Voxtype shortcut action
      ansible.builtin.command:
        argv:
          - gdbus
          - call
          - --session
          - --dest
          - org.kde.kglobalaccel
          - --object-path
          - /kglobalaccel
          - --method
          - org.kde.KGlobalAccel.doRegister
          - '["{{ voxtype_shortcut_desktop_file }}","_launch","{{ voxtype_shortcut_name }}","{{ voxtype_shortcut_name }}"]'
      changed_when: true

    # Flag 4 is NoAutoloading: set this key sequence rather than reloading
    # whatever was stored previously. The key combination is deliberately not
    # interpolated into the task name -- this task is usually skipped, and
    # profile_tasks prints the names of skipped tasks too, which made the
    # recap look as though a binding had been made.
    - name: Bind the Voxtype global shortcut
      ansible.builtin.command:
        argv:
          - gdbus
          - call
          - --session
          - --dest
          - org.kde.kglobalaccel
          - --object-path
          - /kglobalaccel
          - --method
          - org.kde.KGlobalAccel.setShortcutKeys
          - '["{{ voxtype_shortcut_desktop_file }}","_launch","{{ voxtype_shortcut_name }}","{{ voxtype_shortcut_name }}"]'
          - "[([{{ voxtype_shortcut_keycode }}],)]"
          - "4"
      changed_when: true

# Leaving a stale binding registered would give a second, redundant way to
# start dictation, so it is actively torn down rather than just left unset.
- name: Unregister the Voxtype global shortcut when unused
  ansible.builtin.command:
    argv:
      - gdbus
      - call
      - --session
      - --dest
      - org.kde.kglobalaccel
      - --object-path
      - /kglobalaccel
      - --method
      - org.kde.KGlobalAccel.unregister
      - "{{ voxtype_shortcut_desktop_file }}"
      - _launch
  when:
    - not voxtype_kde_shortcut_enabled
    - voxtype_shortcut_keycode | string in voxtype_current_shortcut.stdout
  changed_when: true
