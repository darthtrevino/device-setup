---
- name: Reload Surface Dial udev rules
  become: true
  ansible.builtin.command:
    cmd: udevadm control --reload-rules
  changed_when: true
  listen: Reload Surface Dial device access

- name: Trigger Surface Dial input rules
  become: true
  ansible.builtin.command:
    cmd: udevadm trigger --subsystem-match=input --action=change
  changed_when: true
  listen: Reload Surface Dial device access

- name: Restart Surface Dial service
  ansible.builtin.systemd_service:
    name: "{{ surface_dial_service_name }}"
    scope: user
    enabled: true
    state: restarted
    daemon_reload: true
