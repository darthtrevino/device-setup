---
# Shared workstation paths, carried as *role defaults* rather than in
# group_vars/all so that roles stay self-contained and can be consumed from
# another repository (see galaxy.yml). Role defaults are the lowest-precedence
# source in Ansible, so anything set in group_vars/, host_vars/ or on the
# command line still overrides these.
#
# Roles that reference any of these must depend on this role in
# meta/main.yml; a dependency's defaults are in scope for the dependent role.

# Identity of the human this workstation is being built for. Playbooks run
# locally as that user and only escalate with `become:` where root is needed,
# so these resolve to the invoking account rather than to root.
workstation_user: "{{ ansible_facts['user_id'] }}"
workstation_home: "{{ ansible_facts['env']['HOME'] }}"

# Drop-in directory sourced by ~/.bashrc; roles that need shell integration
# (starship, golang, rust, zen) write a single snippet in here instead of
# appending to ~/.bashrc directly.
workstation_bashrcd: "{{ workstation_home }}/.bashrc.d"

# Where per-user desktop entries, fonts and application config live.
workstation_applications_dir: "{{ workstation_home }}/.local/share/applications"
workstation_fonts_dir: "{{ workstation_home }}/.local/share/fonts"
workstation_config_dir: "{{ workstation_home }}/.config"

# Per-user binaries. Fedora's stock ~/.bashrc prepends this to PATH ahead of
# /usr/bin, so a wrapper dropped here shadows the system copy of the same name.
workstation_local_bin: "{{ workstation_home }}/.local/bin"
