---
- name: Install quickshell from Fedora
  become: true
  ansible.builtin.dnf:
    name: quickshell
    state: present
    enablerepo: "{{ omarchy_shell_quickshell_repos }}"

- name: Read the repository quickshell was installed from
  ansible.builtin.command:
    cmd: dnf repoquery --installed --queryformat '%{from_repo}' quickshell
  register: omarchy_shell_quickshell_origin
  changed_when: false
  check_mode: false
  failed_when: false

# A machine that installed quickshell before the COPR exclusion was in place
# keeps the COPR build, and dnf will not replace it with Fedora's older
# version on its own. distro-sync against the Fedora repositories does.
- name: Move quickshell back onto the Fedora build
  become: true
  ansible.builtin.command:
    cmd: >-
      dnf distro-sync -y --allow-vendor-change
      --repo={{ omarchy_shell_quickshell_repos | join(' --repo=') }}
      quickshell
  changed_when: true
  when: hyprland_copr_repo in (omarchy_shell_quickshell_origin.stdout | default(''))

- name: Install the Omarchy shell
  ansible.builtin.copy:
    src: omarchy/
    dest: "{{ omarchy_shell_install_dir }}/"
    # The vendored tree already carries the right modes -- 0755 on bin/, 0644
    # on the QML -- and git preserves the executable bit. A blanket mode here
    # would flatten bin/ and fight with any task that put it back.
    mode: preserve
    directory_mode: "0755"

- name: Install the shell launcher
  ansible.builtin.template:
    src: omarchy-shell.j2
    dest: "{{ omarchy_shell_launcher }}"
    mode: "0755"

- name: Ensure the shell configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ omarchy_shell_config_dir }}"
    - "{{ omarchy_shell_plugin_dir }}"

- name: Install the shell configuration
  ansible.builtin.copy:
    src: shell.toml
    dest: "{{ omarchy_shell_config_dir }}/shell.toml"
    mode: "0644"

- name: Install the shell plugins
  ansible.builtin.copy:
    src: "plugins/{{ item }}/"
    dest: "{{ omarchy_shell_plugin_dir }}/{{ item }}/"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ omarchy_shell_plugins }}"
