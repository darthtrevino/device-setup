---
# Everything the shell needs is vendored under files/; nothing is fetched at
# provision time. The QML tree comes from basecamp/omarchy (MIT) by way of
# darthtrevino/temu-omarchy, and files/omarchy/UPSTREAM records the exact
# upstream commit and the Fedora adaptations carried on top of it.
omarchy_shell_install_dir: "{{ workstation_home }}/.local/share/omarchy"
omarchy_shell_launcher: "{{ workstation_local_bin }}/omarchy-shell"

# quickshell must come from Fedora proper. The Hyprland COPR ships its own
# build that lags behind and loses the IPC surface the bar relies on, so the
# hyprland role excludes it there and this role syncs it back.
omarchy_shell_quickshell_repos:
  - fedora
  - updates

omarchy_shell_config_dir: "{{ workstation_config_dir }}/omarchy"
omarchy_shell_plugin_dir: "{{ omarchy_shell_config_dir }}/plugins"

# Quickshell plugins vendored alongside the shell. protonpass is deliberately
# omitted; this workstation uses Bitwarden.
omarchy_shell_plugins:
  - io.github.tyrichards.orthodox-daily
