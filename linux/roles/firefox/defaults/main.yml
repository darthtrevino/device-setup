---
firefox_package: firefox
firefox_policy_dir: /etc/firefox/policies

# Force-installed through enterprise policy rather than staged XPIs, so Firefox
# updates them from addons.mozilla.org on its own schedule. `guid` is the
# extension ID and must match AMO exactly or the policy is silently ignored.
firefox_extensions:
  - slug: bitwarden-password-manager
    guid: "{446900e4-71c2-419f-a6a7-df9c091e268b}"
  - slug: ublock-origin
    guid: uBlock0@raymondhill.net
