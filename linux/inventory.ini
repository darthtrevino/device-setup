# Workstation provisioning is intended to run against the local machine.
#
#   ansible-playbook playbooks/workstation.yml -K
#
# Remote workstations can be added under [workstations] as needed.
#
# ansible_local_become_success_timeout: pam_gaze sits at the top of
# /etc/pam.d/sudo, so every escalating task triggers a camera scan before sudo
# prints its password prompt. A scan that finds no face spends about eight
# seconds before falling back, which overruns the ten second default and fails
# the task as UNREACHABLE. The option is settable only as a variable -- it has
# no ansible.cfg or environment binding -- so it lives here.

[workstations]
localhost ansible_connection=local ansible_local_become_success_timeout=60
